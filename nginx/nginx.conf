# ============================================================
# Nginx — Proxy Inverso Universal (Soporte Cloudflare Tunnel)
# ============================================================

upstream observatorio_app {
    server observatorio_web:8000;
}

# Servidor principal (Puerto 80): Acepta cualquier host de Cloudflare
server {
    listen 80 default_server;
    server_name _;

    # Tamaño máximo de subida
    client_max_body_size 100M;

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /vol/web/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Archivos multimedia
    location /media/ {
        alias /vol/web/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy inverso hacia Gunicorn
    location / {
        proxy_pass         http://observatorio_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
